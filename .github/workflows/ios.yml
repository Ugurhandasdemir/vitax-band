name: iOS IPA (imzasız)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - name: iOS derle (imzasız)
        run: |
          flutter build ios --release --no-codesign -v > build.log 2>&1 || {
            grep -nE "error:|requires a (development team|provisioning)|Signing for|No profiles|\*\* BUILD FAILED|The following build commands failed" -A3 build.log | cut -c1-400 | head -80
            exit 1
          }
      - name: IPA paketle
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr vitax_app-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: vitax_app-unsigned-ipa
          path: app/vitax_app-unsigned.ipa
